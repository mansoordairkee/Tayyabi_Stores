<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tayyabi Stores | Gallery</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: #ffffff;
  color: #1d1d1f;
}

    h1 {
      text-align: center;
      margin-bottom: 20px;
    }

    .gallery {
      column-count: 4;
      column-gap: 12px;
    }

    .gallery img {
      width: 100%;
      margin-bottom: 12px;
      border-radius: 8px;
      display: block;
      transition: transform 0.2s;
    }

    .gallery img:hover {
      transform: scale(1.03);
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    }

    /* Responsive Columns */
    @media (max-width: 1200px) {
      .gallery {
        column-count: 3;
      }
    }

    @media (max-width: 800px) {
      .gallery {
        column-count: 2;
      }
    }

    @media (max-width: 500px) {
      .gallery {
        column-count: 1;
      }
    }

    body {
  margin: 0;
  font-family: -apple-system, BlinkMacSystemFont, sans-serif;
  background-color: #ffffff;
  color: #1d1d1f;
}

.topbar {
  padding: 16px 24px;
  background-color: #7fd7dd;
  border-bottom: 1px solid #d2d2d7;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  font-size: 20px;
}

.hero h1 {
  font-size: 1.8rem;
  margin-bottom: 20px;
}



.tabs {
  display: flex;
  justify-content: center;
  margin: 30px 0 10px;
}

.tab {
  padding: 10px 20px;
  border: none;
  background: none;
  font-size: 16px;
  color: #333;
  cursor: pointer;
  border-bottom: 2px solid transparent;
}

.tab.active {
  border-bottom: 2px solid black;
  font-weight: 600;
}

header img {
      width: 60px;
      height: 60px;
      object-fit: cover;
      border-radius: 50%;
    }

.section-header {
      text-align: center;
      margin: 40px 0 20px;
    }

/* Contact Us */

.contact-section {
  padding: 60px 20px;
  background-color: #fff;
  text-align: center;
  color: #333;
}

.contact-section h2 {
  font-size: 2.5rem;
  margin-bottom: 10px;
}

.contact-section h2 span {
  font-weight: bold;
  color: #000;
}

.contact-section .subtitle {
  font-size: 0.9rem;
  color: #888;
  margin-bottom: 40px;
}

.contact-grid {
  display: flex;
  justify-content: center;
  gap: 40px;
  flex-wrap: wrap;
}

.contact-card {
  flex: 0 1 200px;
  text-align: center;
}

.contact-card img {
  width: 40px;
  height: 40px;
  margin-bottom: 10px;
}

.contact-card h4 {
  font-size: 0.9rem;
  font-weight: bold;
  letter-spacing: 1px;
  color: #555;
  margin-bottom: 5px;
}

.contact-card p {
  font-size: 0.95rem;
  color: #333;
}


  </style>
</head>
<body>

    <header class="topbar">

    <div class="tabs">
