<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Gallery - Tayyabi Stores</title>
  <meta name="description" content="View our gallery of premium bathroom and kitchen installations.">
  <link rel="stylesheet" href="css/styles.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div id="navbar"></div>

  <section class="hero" style="padding: 3rem 0;">
    <div class="container">
      <h1>Gallery</h1>
      <p>Explore our collection of premium products and installations</p>
    </div>
  </section>

  <section class="section">
    <div class="container">
      <div id="gallery-grid" class="gallery-grid" aria-live="polite"></div>
    </div>
  </section>

  <div id="footer"></div>

  <script src="js/common.js"></script>


  <script>
    // Initialize page (keeps your original behavior if initPage exists)
    if (typeof initPage === 'function') {
      try { initPage('gallery'); } catch(e){ console.warn('initPage failed:', e); }
    }

    const galleryGrid = document.getElementById('gallery-grid');

    // Static fallback images (keeps your existing file names)
    const staticImages = [
      'assets/products/galary/1.jpg',
      'assets/products/galary/2.jpg',
      'assets/products/galary/3.jpg',
      'assets/products/galary/4.jpg',
      'assets/products/galary/5.jpg',
      'assets/products/galary/6.jpg',
      'assets/products/galary/7.jpg',
      'assets/products/galary/8.jpg',
      'assets/products/galary/9.jpg',
      'assets/products/galary/10.jpg',
      'assets/products/galary/11.jpg',
      'assets/products/galary/12.jpg',
      'assets/products/galary/13.jpg',
      'assets/products/galary/14.jpg',
      'assets/products/galary/15.jpg',
      'assets/products/galary/16.jpg',
      'assets/products/galary/17.jpg',
      'assets/products/galary/18.jpg'
    ];

    // Helper to create an item element (with graceful fallback if image fails)
    function createGalleryItem(src, altText = '') {
      const item = document.createElement('div');
      item.className = 'gallery-item';

      const img = document.createElement('img');
      img.loading = 'lazy';
      img.alt = altText || 'Gallery image';
      img.src = src;

      // On error show placeholder with name (avoids broken image icon)
      img.onerror = function () {
        item.innerHTML = `<div class="img-placeholder">Image unavailable</div>`;
      };

      item.appendChild(img);
      return item;
    }

    // Build gallery data source:
    // - If a `products` array exists and has image fields, use it
    // - Otherwise fall back to staticImages
    (function renderGallery() {
      let source = [];

      if (Array.isArray(window.products) && window.products.length) {
        // try to pick representative subset like you did originally (every 3rd)
        source = window.products.map(p => ({
          src: p.image || p.img || p.imageUrl || '',
          alt: p.name || p.title || 'Product'
        })).filter(p => p.src);
        // If you want fewer images, you can filter like: source = source.filter((_, i) => i % 3 === 0);
      }

      if (!source.length) {
        source = staticImages.map((src, i) => ({ src, alt: `Photo ${i + 1}` }));
      }

      // Clear any existing content and append items
      galleryGrid.innerHTML = '';
      source.forEach(item => {
        galleryGrid.appendChild(createGalleryItem(item.src, item.alt));
      });
    })();
  </script>
</body>
</html>
